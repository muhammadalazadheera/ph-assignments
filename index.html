<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Board</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <header class="mt-5 rounded-lg w-[90%] h-[50px] px-4 mx-auto bg-white shadow-sm flex items-center">
        <div class="flex-1">
            <img width="30" class="inline" src="assets/images/logo.png" alt="">
            <h1 class="inline">Dev<span class="text-xl font-bold">Board</span></h1>
        </div>
        <div class="nav-buttons flex-1">
            <ul>
                <li><button><img width="20" src="assets/images/theme-btn.png" alt=""></button></li>
                <li><button><input type="checkbox" checked id=""></button></li>
            </ul>
        </div>
    </header>
    <main class="dashboard w-[90%] mx-auto mt-5 rounded-lg">
        <div class="dashboard-content bg-white px-3 py-5 shadow-sm">
            <div class="stats">
                <div class="bg-[#F4F7FF]">
                    <div class="task-check">
                        <input type="checkbox" name="" id="">
                    </div>
                    <div class="task-text">
                        <p>Task Assigned</p>
                        <h2>6</h2>
                    </div>
                </div>
                <div class="blog-button text-center">
                    <a href="#">Discover Something New Today</a>
                </div>
                <div class="current-time">
                    <p id="time">11-22-33</p>
                </div>
            </div>
        </div>
        <div class="dashboard-sidebar bg-white">
            heera
        </div>
    </main>
    <script src="assets/js/main.js"></script>
</body>

</html>
